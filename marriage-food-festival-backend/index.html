<!DOCTYPE html>
<html>
<head>
  <title>Marriage Food Festival Items</title>
</head>
<body>
  <h1>Marriage Food Festival Items</h1>

  <!-- Form to add a new item -->
  <form id="itemForm">
    <input type="text" id="name" placeholder="Name" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="text" id="description" placeholder="Description" required>
    <button type="submit">Add Item</button>
  </form>

  <h2>All Items</h2>
  <ul id="itemsList"></ul>

  <script>
    // Load all items from backend
    async function loadItems() {
      const res = await fetch("http://127.0.0.1:5000/items/");
      const items = await res.json();
      const list = document.getElementById("itemsList");
      list.innerHTML = "";
      items.forEach(item => {
        const li = document.createElement("li");
        li.textContent = `${item.name} (${item.email}) - ${item.description}`;
        list.appendChild(li);
      });
    }

    // Handle form submission
    document.getElementById("itemForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value;
      const email = document.getElementById("email").value;
      const description = document.getElementById("description").value;

      await fetch("http://127.0.0.1:5000/items/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name, email, description })
      });

      loadItems(); // refresh list
    });

    // Load items on page load
    loadItems();
  </script>
</body>
</html>
